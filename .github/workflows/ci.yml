name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # bun.lock is lockfileVersion 2, which only Bun >=1.4.0 can read
        # (older 1.3.x releases error with "Unknown lockfile version").
        bun: ["1.4.0", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install dependencies
        run: bun ci

      - name: Lint and format
        run: bunx biome ci --error-on-warnings

      - name: Unused files and exports
        run: bun run knip

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Check docs/api.md and docs/api.json are up to date
        run: bun run docs && git diff --exit-code -- docs/api.md docs/api.json

      - name: Run tests
        run: bun test ./tests

      - name: Check documentation examples
        run: bun run check

      - name: Smoke examples
        run: bun run examples
